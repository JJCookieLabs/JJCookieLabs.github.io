<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lobbix V0.8.5 — SafeGuard 1.0.1</title>
<style>
:root{
  font-family:system-ui,Arial;
  --bg:#f5f6fb;
  --panel:#fff;
  --text:#202238;
  --sub:#68718a;
  --line:#e0e3ec;
  --accent:#655be0;
  color-scheme:light
}
body.dark{
  --bg:#141826;
  --panel:#242a3c;
  --text:#f3f3ff;
  --sub:#c0c7de;
  --line:#41475b;
  --accent:#a296ff;
  color-scheme:dark
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0}
button,input,textarea,select{font:inherit}
button{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  color:white;
  background:var(--accent);
  cursor:pointer;
  transition:background-color .16s ease,border-color .16s ease,
    box-shadow .16s ease,filter .16s ease,transform .16s ease
}
button.alt{
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--line)
}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px
}
.room button:focus-visible{outline-color:#fff}
@media(hover:hover) and (pointer:fine){
  button:not(:disabled):hover{
    filter:brightness(1.08);
    transform:translateY(-2px);
    box-shadow:0 6px 16px #14182624
  }
  button.alt:not(:disabled):hover{border-color:var(--accent)}
  .room button:not(:disabled):hover{border-color:#ffffffb3}
}
button:not(:disabled):active{
  transform:translateY(0) scale(.98);
  filter:brightness(.96)
}
@media(prefers-reduced-motion:reduce){
  button{transition:none}
  button:not(:disabled):hover,button:not(:disabled):active{transform:none}
}
input,textarea,select{
  padding:11px;
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:11px;
  color:var(--text)
}
label{display:block;margin:12px 0 5px}
.hidden{display:none!important}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:22px;
  border-radius:18px;
  margin:12px 0
}
.muted{color:var(--sub);font-size:14px}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px
}
.notice{
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  margin:12px 0;
  overflow-wrap:anywhere;
  white-space:pre-line
}
.auth{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:20px
}
.auth>.card{width:min(440px,100%)}
.auth h1{margin-top:0}
.app{display:flex;min-height:100dvh}
.nav{
  width:210px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:20px 12px
}
.nav button{
  display:block;
  width:100%;
  margin:5px 0;
  text-align:left
}
.main{
  padding:22px;
  width:100%;
  max-width:1100px;
  margin:auto
}
.wide{width:100%}
.room{
  position:fixed;
  z-index:10;
  inset:0;
  display:flex;
  flex-direction:column;
  color:white;
  background:linear-gradient(125deg,#384879,#182339);
  --shade:.48
}
.room.gridbg{
  background-image:
    linear-gradient(#ffffff15 1px,transparent 1px),
    linear-gradient(90deg,#ffffff15 1px,transparent 1px),
    linear-gradient(125deg,#384879,#182339);
  background-size:35px 35px,35px 35px,cover
}
.room.waves{
  background:
    radial-gradient(ellipse at 5% 10%,#587daf,transparent 65%),
    radial-gradient(ellipse at 90% 85%,#7459a3,transparent 60%),
    #21283f
}
.room::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,7,28,var(--shade));
  pointer-events:none
}
.room>*{position:relative}
.roomtop{
  padding:12px 15px;
  background:#11162b80;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}
.roomtop button{
  background:#ffffff2b;
  border:1px solid #ffffff55
}
.roomlayout{
  flex:1;
  min-height:0;
  padding:10px;
  display:grid;
  gap:10px;
  grid-template-columns:145px 1fr minmax(280px,420px)
}
.glass{
  border-radius:15px;
  border:1px solid #ffffff38;
  background:#141c38a0;
  backdrop-filter:blur(12px);
  padding:14px;
  min-height:0
}
.mini{display:flex;flex-direction:column;gap:7px}
.mini button{background:#ffffff24;text-align:left}
.work{overflow:auto}
.chat{display:flex;flex-direction:column}
.messages{flex:1;min-height:100px;overflow:auto}
.msg{

  padding:10px;
  background:#ffffff19;
  border-radius:12px;
  overflow-wrap:anywhere
}
.msg.me{background:#8777ff60}
.msg small{color:#d7daec}
.composer{display:flex;gap:8px}
.composer input{min-width:0}
.room input,.room textarea,.room select{
  background:#ffffff24;
  border-color:#ffffff64;
  color:white
}
.room option{background:#252b45}
.room input::placeholder{color:#d7d9eb}
.room .alt{
  background:#ffffff29;
  color:white;
  border-color:#ffffff55
}
.room .muted{color:#d3d8eb}
canvas{
  width:100%;
  background:white;
  touch-action:none;
  border-radius:10px
}
.admin-login-note{
  font-size:13px;
  line-height:1.5;
  color:var(--sub)
}
@media(max-width:790px){
  .roomlayout{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(130px,.7fr) minmax(220px,1.2fr)

  .mini{flex-direction:row;overflow:auto}

  .nav button{width:auto;font-size:11px;padding:8px}
  .main{padding:14px}

}
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>

<script>
'use strict';

const URL_SUPA = 'https://hkwnfxgrnyvyfprzvlyb.supabase.co';
const PUBLIC_KEY = 'sb_publishable_hzBek5ZmTxpaNZcQiDPwgA_i4Lhv3o0';

const ADMIN_COMMAND = '©JJCookie-Administration';

const $ = id => document.getElementById(id);

const safe = value => String(value ?? '').replace(
  /[&<>"']/g,
  character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[character])
);

const redirect = () => location.origin + location.pathname;

let db = null;
let user = null;
let profile = null;
let admin = false;
let mode = 'login';
let currentPage = 'home';
let lobbies = [];
let lobby = null;
let joinedAt = '';
let members = [];
let poller = null;
let recovering = false;
let adminLoginPending = false;
let adminPanelUnlocked = false;
let commandBuffer = '';
let authSubmitting = false;
let profileLoadingId = null;
let sending = false;

try {
  if (localStorage.getItem('lobbix-theme') === 'dark') {
    document.body.classList.add('dark');
  }
} catch {}

function theme() {
  document.body.classList.toggle('dark');

  try {
    localStorage.setItem(
      'lobbix-theme',
      document.body.classList.contains('dark') ? 'dark' : 'light'
    );
  } catch {}
}

function notice(text, target = 'authError') {
  const element = $(target);
  if (!element) return;

  element.textContent = String(text);
  element.classList.remove('hidden');
}

function hideNotice(target = 'authError') {
  $(target)?.classList.add('hidden');
}

function fail(error, target = 'authError') {
  console.error('Lobbix :', error);

  let detail = error?.message || String(error);

  if (error?.code) {
    detail += ' (code ' + error.code + ')';
  }

  if (error?.status) {
    detail += ' [HTTP ' + error.status + ']';
  }

  notice(detail, target);
}

function screen(name) {
  $('auth').classList.toggle('hidden', name !== 'auth');
  $('app').classList.toggle('hidden', name !== 'app');
  $('room').classList.toggle('hidden', name !== 'room');
}

function renderAuth(modeName) {
  mode = modeName;
  screen('auth');
  hideNotice();

  let html = mode === 'admin'
    ? ''
    : `
      <div class="row">
        <button type="button" class="alt" onclick="renderAuth('login')">Connexion</button>
        <button type="button" class="alt" onclick="renderAuth('signup')">Inscription</button>
      </div>
    `;

  if (mode === 'admin') {
    html += `
      <h2>🛡️ Accès administrateur</h2>

      <p class="admin-login-note">
        Connecte-toi avec un compte disposant déjà du rôle administrateur.
      </p>

      <form onsubmit="adminSignIn(event)">
        <label for="adminEmail">Email du compte administrateur</label>
        <input
          id="adminEmail"
          type="email"
          required
          autocomplete="username"
        >

        <label for="adminPassword">Mot de passe</label>
        <input
          id="adminPassword"
          type="password"
          required
          autocomplete="current-password"
        >

        <p>
          <button class="wide" type="submit">
            Se connecter à l’administration
          </button>
        </p>
      </form>

      <button type="button" class="alt" onclick="cancelAdminLogin()">Annuler</button>
    `;
  } else if (mode === 'login' || mode === 'signup') {
    const signup = mode === 'signup';

    html += `
      <form onsubmit="authSubmit(event)">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="email"
        >

        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          minlength="${signup ? 8 : 1}"
          required
          autocomplete="${signup ? 'new-password' : 'current-password'}"
        >
    `;

    if (signup) {
      html += `
        <p class="muted">
          Un email de confirmation pourra être nécessaire.
        </p>

        <label>
          <input
              id="accept"
              type="checkbox"
              style="width:auto"
              required
          >
          J’accepte les règles :
          respect des autres, aucun harcèlement et aucune publication
          des informations personnelles d’autrui.
        </label>
      `;
    }

    html += `
        <p>
          <button class="wide" type="submit">
            ${signup ? 'Créer mon compte' : 'Se connecter'}
          </button>
        </p>
      </form>
    `;

    if (!signup) {
      html += `
        <button type="button" class="alt" onclick="renderAuth('forgot')">
          Mot de passe oublié ?
        </button>

        <button type="button" class="alt" onclick="renderAuth('resend')">
          Renvoyer la confirmation
        </button>
      `;
    }
  } else if (mode === 'resend') {
    html += `
      <form onsubmit="resendConfirmation(event)">
        <h3>Renvoyer le lien de confirmation</h3>
        <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="Adresse email"
        >
        <p><button type="submit" class="wide">Renvoyer le lien</button></p>
      </form>
    `;
  } else if (mode === 'forgot') {
    html += `
      <form onsubmit="forgot(event)">
        <h3>Réinitialisation du mot de passe</h3>
        <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="Adresse email"
        >
        <p><button type="submit" class="wide">Envoyer un lien</button></p>
      </form>
    `;
  } else if (mode === 'reset') {
    html += `
      <form onsubmit="resetPassword(event)">
        <h3>Nouveau mot de passe</h3>
        <input
            id="newPassword"
            type="password"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="Nouveau mot de passe"
        >
        <p><button type="submit" class="wide">Enregistrer</button></p>
      </form>
    `;
  } else if (mode === 'nickname') {
    html += `
      <form onsubmit="setNickname(event)">
        <h3>Créer ton profil</h3>

        <input
            id="nickname"
            required
            minlength="3"
            maxlength="24"
            pattern="[A-Za-z0-9_]{3,24}"
            autocomplete="nickname"
            placeholder="Pseudonyme unique"
        >

        <p class="muted">
          Entre 3 et 24 caractères : lettres, chiffres ou tiret bas.
        </p>

        <p>
          <label>
            <input
                id="accept"
                type="checkbox"
                style="width:auto"
                required
            >
            J’accepte les règles du prototype.
          </label>
        </p>

        <button type="submit" class="wide">Continuer</button>
      </form>
    `;
  }

  $('authForm').innerHTML = html;
}

/* SESSION ET TRANSMISSION DU JETON UTILISATEUR */

async function startup() {
  renderAuth('login');

  if (!window.supabase?.createClient) {
    notice('Impossible de charger Supabase JS. Vérifie ta connexion Internet.');
    return;
  }

  const sessionKey = 'lobbix-email-v084-hkwnfxgrnyvyfprzvlyb';
  const memory = new Map();

  const storage = {
    getItem(key) {
      if (memory.has(key)) {
        return memory.get(key);
      }

      try {
        const value = localStorage.getItem(key);

        if (value !== null) {
          memory.set(key, value);
        }

        return value;
      } catch {
        return null;
      }
    },

    setItem(key, value) {
      memory.set(key, value);

      try {
        localStorage.setItem(key, value);
      } catch {}
    },

    removeItem(key) {
      memory.delete(key);

      try {
        localStorage.removeItem(key);
      } catch {}
    }
  };

  let signedSession = null;
  const baseFetch = globalThis.fetch.bind(globalThis);

  async function authenticatedFetch(input, init = {}) {
    const target = new URL(
      typeof input === 'string' ? input : input.url,
      URL_SUPA
    );

    const protectedApi =
      target.origin === new URL(URL_SUPA).origin &&
      (
        target.pathname.startsWith('/rest/v1/') ||
        target.pathname.startsWith('/functions/v1/')
      );

    if (protectedApi) {
      if (!signedSession?.access_token) {
        throw Object.assign(
          new Error('Session absente : reconnecte-toi à Lobbix.'),
          { code: 'LOBBIX_SESSION_MISSING' }
        );
      }

      const headers = new Headers(
        typeof Request !== 'undefined' && input instanceof Request
          ? input.headers
          : undefined
      );

      new Headers(init.headers).forEach((value, key) => {
        headers.set(key, value);
      });

      headers.set(
        'Authorization',
        'Bearer ' + signedSession.access_token
      );

      init = { ...init, headers };
    }

    return baseFetch(input, init);
  }

  try {
    db = window.supabase.createClient(URL_SUPA, PUBLIC_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storageKey: sessionKey,
        storage
      },

      global: {
        fetch: authenticatedFetch
      }
    });

    // Aucun appel Auth asynchrone dans ce callback.
    db.auth.onAuthStateChange((event, session) => {
      if (session?.access_token) {
        signedSession = session;
        storage.setItem(sessionKey, JSON.stringify(session));
      }

      if (event === 'PASSWORD_RECOVERY') {
        recovering = true;
        user = session?.user ?? null;
        renderAuth('reset');
      }

      if (event === 'SIGNED_OUT') {
        signedSession = null;
        storage.removeItem(sessionKey);

        user = null;
        profile = null;
        admin = false;
        adminPanelUnlocked = false;
        lobby = null;

        clearInterval(poller);
        poller = null;

        if (!adminLoginPending) {
          renderAuth('login');
        }
      }
    });

    const { data, error } = await db.auth.getSession();

    if (error) {
      throw error;
    }

    if (
      data.session?.access_token &&
      data.session.user &&
      !recovering
    ) {
      signedSession = data.session;
      await loadUser(data.session);
    }
  } catch (error) {
    console.error('Démarrage Lobbix :', error);
    renderAuth('login');
    notice(authErrorMessage(error));
  }
}

function authErrorMessage(error) {
  const code = String(error?.code || '');
  const raw = String(error?.message || error || 'Erreur inconnue');
  const lower = raw.toLowerCase();

  if (
    code === 'email_not_confirmed' ||
    lower.includes('email not confirmed')
  ) {
    return 'Adresse email non confirmée. Ouvre le lien reçu par email, puis reconnecte-toi.';
  }

  if (
    code === 'invalid_credentials' ||
    lower.includes('invalid login credentials')
  ) {
    return 'Identifiants refusés. Vérifie ton adresse email et ton mot de passe.';
  }

  if (
    code === 'email_address_not_authorized' ||
    lower.includes('email address not authorized')
  ) {
    return 'Le service email refuse cette adresse. La configuration SMTP du projet doit être vérifiée.';
  }

  if (
    code === 'over_email_send_rate_limit' ||
    lower.includes('rate limit') ||
    lower.includes('too many')
  ) {
    return 'Limite d’envoi atteinte. Attends avant de recommencer.';
  }

  if (code === 'signup_disabled') {
    return 'Les inscriptions sont actuellement désactivées.';
  }

  if (code === 'LOBBIX_SESSION_MISSING') {
    return 'Ta session n’est plus disponible. Reconnecte-toi avec ton email et ton mot de passe.';
  }

  return raw + (code ? ' (code ' + code + ')' : '');
}

/* CONNEXION ET INSCRIPTION */

async function authSubmit(event) {
  event.preventDefault();

  if (authSubmitting) {
    return;
  }

  authSubmitting = true;

  const email = $('email')?.value.trim();
  const password = $('password')?.value;
  const isSignup = mode === 'signup';
  const button = event.currentTarget.querySelector('button[type="submit"]');

  if (button) {
    button.disabled = true;
  }

  notice(
    isSignup
      ? 'Création du compte…'
      : 'Connexion en cours…'
  );

  try {
    if (!db) {
      throw Error('Connexion Supabase indisponible.');
    }

    if (isSignup) {
      if (!$('accept')?.checked) {
        throw Error('Accepte les règles du prototype.');
      }

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: redirect()
        }
      });

      if (error) {
        throw error;
      }

      if (data.session?.access_token && data.session.user) {
        hideNotice();
        await loadUser(data.session);
      } else {
        renderAuth('login');
        notice(
          'Inscription demandée. Si la confirmation email est activée, ouvre le lien reçu avant de te connecter.'
        );
      }
    } else {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      if (!data.session?.access_token || !data.session.user) {
        throw Error('La connexion n’a pas créé de session valide.');
      }

      hideNotice();
      await loadUser(data.session);
    }
  } catch (error) {
    console.error('Connexion Lobbix :', error);
    notice(authErrorMessage(error));
  } finally {
    authSubmitting = false;

    if (button?.isConnected) {
      button.disabled = false;
    }
  }
}

async function forgot(event) {

async function resetPassword(event) {

    const { error } = await db.auth.updateUser({
      password: $('newPassword').value
    });

    recovering = false;

    if (sessionResult.data.session?.access_token) {
      await loadUser(sessionResult.data.session);
    } else {
      renderAuth('login');
      notice('Mot de passe modifié. Tu peux maintenant te connecter.');
    }
  } catch (error) {
    notice(authErrorMessage(error));

/* PROFIL */

async function reloadAccount() {
  try {
    if (!db) throw Error('Connexion Supabase indisponible.');

    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (!data.session?.access_token || !data.session.user) {
      user = null;
      profile = null;
      renderAuth('login');
      notice('Ta session n’est plus active. Connecte-toi à nouveau.');
      return;
    }

    await loadUser(data.session);
  } catch (error) {
    console.error('Actualisation de la session :', error);
    renderAuth('login');
    notice(authErrorMessage(error));
  }
}

async function loadUser(session) {
  if (recovering || adminLoginPending) {
    return;
  }

  if (!session?.access_token || !session.user?.id) {
    user = null;
    profile = null;
    renderAuth('login');
    notice('Aucune session valide. Connecte-toi avec ton email.');
    return;
  }

  const nextUser = session.user;

  if (profileLoadingId === nextUser.id) {
    return;
  }

  profileLoadingId = nextUser.id;
  user = nextUser;

  try {
    const { data, error } = await db.rpc('lobbix_my_profile');

    if (error) throw error;

    profile = data;

    if (!profile) {
      renderAuth('nickname');
      return;
    }

    admin = false;
    adminPanelUnlocked = false;

    $('appNav').classList.remove('hidden');

    screen('app');
    lobbies = [];

    try {
      await listRooms();
      hideNotice('appError');
    } catch (roomError) {
      console.error('Liste des lobbies :', roomError);

      notice(
        'Les lobbies sont momentanément indisponibles : ' +
        (roomError?.message || roomError),
        'appError'
      );
    }

    page('home');
  } catch (error) {
    console.error('Lecture du profil :', error);

    if (error?.code === 'LOBBIX_SESSION_MISSING') {
      renderAuth('login');
      notice(authErrorMessage(error));
      return;
    }

    $('appNav').classList.add('hidden');
    screen('app');
    $('heading').textContent = 'Profil indisponible';

    $('content').innerHTML = `
      <div class="card">
        <h2>Le profil n’a pas pu être chargé</h2>
        <p class="muted">
          Réessaie ou reconnecte-toi.
        </p>
        <button type="button" onclick="reloadAccount()">Réessayer</button>
        <button type="button" class="alt" onclick="signout()">Se déconnecter</button>
      </div>
    `;

    notice(
      'Erreur de chargement du profil : ' +
      (error?.message || error) +
      (error?.code ? ' (code ' + error.code + ')' : ''),
      'appError'
    );
  } finally {
    profileLoadingId = null;
  }
}

async function setNickname(event) {
  event.preventDefault();

  try {
    if (!$('accept')?.checked) {
      throw Error('Accepte les règles du prototype.');
    }

    const nickname = $('nickname').value.trim();

    if (!/^[A-Za-z0-9_]{3,24}$/.test(nickname)) {
      throw Error('Pseudo invalide.');
    }

    const answer = await safeguard({
      action: 'nickname',
      nickname
    });

    if (!answer.ok) {
      throw Error(
        answer.reason ||
        answer.message ||
        'Pseudonyme refusé.'
      );
    }

    await reloadAccount();
  } catch (error) {
    fail(error);
  }
}

/* SAFEGUARD : LES ÉCRITURES PASSENT PAR LE SERVEUR */

async function safeguard(payload) {
  if (!db) {
    throw Error('Connexion Supabase indisponible.');
  }

  const { data, error } = await db.functions.invoke(
    'lobbix-safeguard',
    { body: payload }
  );

  let result = data;

  if (error) {
    if (error.context && typeof error.context.json === 'function') {
      try {
        result = await error.context.json();
      } catch (parseError) {
        console.warn('Réponse SafeGuard :', parseError);
      }
    }

    if (!result || typeof result !== 'object') {
      throw Error(error.message || 'SafeGuard indisponible.');
    }
  }

  if (!result || typeof result !== 'object') {
    throw Error('Réponse SafeGuard illisible.');
  }

  return result;
}

async function createRoom(event) {
  event.preventDefault();

  try {
    const name = $('rName').value.trim();

    const reply = await safeguard({
      action: 'lobby',
      name,
      description: $('rDesc').value,
      hours: $('rHours').value
        ? Number($('rHours').value)
        : null,
      empty_minutes: Number($('rEmpty').value)
    });

    if (!reply.ok) {
      throw Error(
        reply.reason ||
        reply.message ||
        'Lobby refusé.'
      );
    }

    await joinRoom(reply.lobby_id, name);
  } catch (error) {
    fail(error, 'appError');
  }
}

async function joinRoom(id, name) {
  try {
    if (!user) {
      throw Error('Connecte-toi avant de rejoindre un lobby.');
    }

    const { error } = await db.rpc('lobbix_join_public', {
      p_lobby: id
    });

    if (error) throw error;

    const membership = await db
      .from('lobbix_members')
      .select('joined_at')
      .eq('lobby_id', id)
      .eq('user_id', user.id)
      .maybeSingle();

    if (membership.error) throw membership.error;

    joinedAt =
      membership.data?.joined_at ||
      new Date().toISOString();

    lobby = {
      id,
      name:
        name ||
        lobbies.find(room => room.id === id)?.name ||
        'Lobby'
    };

    $('roomName').textContent = '🎮 ' + lobby.name;
    screen('room');

    let background = 'aurora';

    try {
      background = localStorage.getItem('lobbix-bg') || 'aurora';
    } catch {}

    setWall(background);
    activity('home');

    await updateRoom();

    clearInterval(poller);
    poller = setInterval(updateRoom, 3000);
  } catch (error) {
    fail(error, 'appError');
  }
}

async function leaveRoom() {
  clearInterval(poller);
  poller = null;

  try {
    if (db && user) {
      const { error } = await db.rpc('lobbix_leave');
      if (error) throw error;
    }
  } catch (error) {
    console.error('Départ du lobby :', error);
  }

  lobby = null;
  members = [];

  screen('app');

  try {
    await listRooms();
  } catch (error) {
    fail(error, 'appError');
  }

  page('home');
}

async function updateRoom() {
  if (!lobby || !user) return;

  const activeLobby = lobby;

  try {
    const [messagesResult, membersResult] = await Promise.all([
      db
        .from('lobbix_messages')
        .select('id,sender_id,body,created_at,deleted_at')
        .eq('lobby_id', activeLobby.id)
        .gte('created_at', joinedAt)
        .order('created_at')
        .limit(200),

      db.rpc('lobbix_room_members', {
        p_lobby: activeLobby.id
      })
    ]);

    if (messagesResult.error) throw messagesResult.error;
    if (membersResult.error) throw membersResult.error;

    if (!lobby || lobby.id !== activeLobby.id) {
      return;
    }

    members = membersResult.data || [];

    $('count').textContent = members.length + '/25 joueurs';

    const names = new Map(
      members.map(member => [member.user_id, member.nickname])
    );

    const element = $('messages');

    const atEnd =
      element.scrollHeight -
      element.scrollTop -
      element.clientHeight < 100;

    const messages = (messagesResult.data || []).filter(message => {
      return (
        activeLobby.name.toLowerCase() !== 'random' ||
        Date.now() - new Date(message.created_at).getTime() < 86400000
      );
    });

    element.innerHTML = messages.map(message => `
      <div class="msg ${message.sender_id === user.id ? 'me' : ''}">
        <small>
          ${safe(names.get(message.sender_id) || 'Joueur')}
          ·
          ${new Date(message.created_at).toLocaleTimeString('fr-FR')}
        </small>

        <div>
          ${
            message.deleted_at
              ? 'Message supprimé'
              : safe(message.body)
          }
        </div>

        <button type="button"
            class="alt"
            onclick="report(${Number(message.id)})"
            style="padding:4px 6px;font-size:11px"
        >
          ⚑ Signaler
        </button>
      </div>
    `).join('') || '<p class="muted">Aucun message depuis ton entrée.</p>';

    if (atEnd) {
      element.scrollTop = element.scrollHeight;
    }

    if ($('players')) {
      $('players').innerHTML = members
        .map(member => '<li>' + safe(member.nickname) + '</li>')
        .join('');
    }
  } catch (error) {
    console.error('Actualisation du chat :', error);

    if ($('sgNotice')) {
      $('sgNotice').textContent =
        'Actualisation impossible : ' + (error.message || error);
    }
  }
}

/* MESSAGES */

async function send() {
  if (!lobby || sending) return;

  const input = $('message');
  const text = input.value.trim();

  if (!text) return;

  if (text === ADMIN_COMMAND) {
    input.value = '';
    await openAdminLogin();
    return;
  }

  sending = true;

  const output = $('sgNotice');

  if (output) {
    output.textContent = '🛡️ SafeGuard vérifie ton message…';
  }

  try {
    let result = await safeguard({
      action: 'message',
      lobby_id: lobby.id,
      text
    });

    if (result.verdict === 'warning') {
      const confirmed = confirm(
        '⚠️ SafeGuard : ' +
        result.reason +
        '\n\nEnvoyer quand même ?'
      );

      if (!confirmed) {
        if (output) output.textContent = 'Message non envoyé.';
        return;
      }

      result = await safeguard({
        action: 'message',
        lobby_id: lobby.id,
        text,
        confirm_warning: true
      });
    }

    if (!result.ok) {
      const reason =
        result.reason ||
        result.message ||
        'Message refusé.';

      if (output) {
        output.textContent = '🚫 ' + reason;
      }

      if (result.muted_until) {
        alert(
          'Envoi suspendu jusqu’à ' +
          new Date(result.muted_until).toLocaleTimeString('fr-FR')
        );
      }

      return;
    }

    input.value = '';

    if (output) {
      output.textContent = '✅ Message accepté par SafeGuard';
    }

    await updateRoom();
  } catch (error) {
    if (output) {
      output.textContent =
        '❌ ' +
        (error.message || 'SafeGuard indisponible : envoi annulé.');
    }
  } finally {
    sending = false;
  }
}

async function report(id) {
  const reason = prompt(

  if (reason === null) return;

  try {

    .filter(Boolean);

    return;
  }

  const bytes = new Uint32Array(1);
  crypto.getRandomValues(bytes);

  $('picked').textContent =
    '🎉 ' + choices[bytes[0] % choices.length];
}

function drawCanvas() {
  const canvas = $('canvas');
  const context = canvas.getContext('2d');

  context.strokeStyle = '#655be0';
  context.lineWidth = 3;
  context.lineCap = 'round';

  let pressed = false;

  const position = event => {
    const bounds = canvas.getBoundingClientRect();

    return [
      (event.clientX - bounds.left) * canvas.width / bounds.width,
      (event.clientY - bounds.top) * canvas.height / bounds.height
    ];
  };

  canvas.onpointerdown = event => {
    pressed = true;
    canvas.setPointerCapture(event.pointerId);
    context.beginPath();
    context.moveTo(...position(event));
  };

  canvas.onpointermove = event => {
    if (!pressed) return;

    context.lineTo(...position(event));
    context.stroke();
  };

  canvas.onpointerup = canvas.onpointercancel = () => {
    pressed = false;
  };
}

async function review(id, deleteMessage) {
  if (!confirm('Confirmer cette action ?')) return;

  try {
    const { error } = await db.rpc('lobbix_admin_review_report', {
      p_report: id,
      p_delete_message: deleteMessage
    });

    if (error) throw error;

    await showAdmin();
  } catch (error) {
    fail(error, 'appError');
  }
}

function cancelAdminLogin() {
  adminLoginPending = false;

  if (user && profile) {
    screen('app');
    page('home');
  } else {
    renderAuth('login');
  }
}

async function openAdminLogin() {
  commandBuffer = '';
  admin = false;
  adminPanelUnlocked = false;

  if (lobby && db) {
    clearInterval(poller);
    poller = null;

    try {
      const { error } = await db.rpc('lobbix_leave');
      if (error) throw error;
    } catch (error) {
      console.warn('Départ du lobby :', error);
    }

    lobby = null;
  }

  renderAuth('admin');
}

async function adminSignIn(event) {
  event.preventDefault();
  hideNotice();

  if (adminLoginPending) return;

  if (!db) {
    notice('Connexion Supabase indisponible.');
    return;
  }

  const email = $('adminEmail')?.value.trim();
  const password = $('adminPassword')?.value;
  const button = event.currentTarget.querySelector('button[type="submit"]');

  adminLoginPending = true;

  if (button) {
    button.disabled = true;
  }

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (!data.user || !data.session?.access_token) {
      throw Error('Session non valide.');
    }

    const check = await db.rpc('lobbix_is_admin');

    if (check.error) throw check.error;

    if (check.data !== true) {
      const result = await db.auth.signOut();

      if (result.error) throw result.error;

      throw Error(
        'Accès refusé : ce compte ne possède pas le rôle administrateur.'
      );
    }

    user = data.user;
    admin = true;
    adminPanelUnlocked = true;

    $('appNav').classList.add('hidden');
    screen('app');
    page('admin');
  } catch (error) {
    admin = false;
    adminPanelUnlocked = false;
    renderAuth('admin');
    notice(authErrorMessage(error));
  } finally {
    adminLoginPending = false;

    if (button?.isConnected) {
      button.disabled = false;
    }
  }
}

/* OUVERTURE PAR LA COMMANDE EXACTE */

document.addEventListener('keydown', event => {
  if (
    event.ctrlKey ||
    event.metaKey ||
    event.key === 'Backspace' ||
    event.key === 'Escape'
  ) {
    if (event.key === 'Escape' || event.key === 'Backspace') {
      commandBuffer = '';
    }

    return;
  }

  if (
    event.target instanceof HTMLInputElement &&
    event.target.type === 'password'
  ) {
    return;
  }

  if (event.key.length !== 1) return;

  commandBuffer = (commandBuffer + event.key)
    .slice(-ADMIN_COMMAND.length);

  if (commandBuffer === ADMIN_COMMAND) {
    event.preventDefault();
    openAdminLogin();
  }
}, true);

document.addEventListener('paste', event => {
  if (
    event.target instanceof HTMLInputElement &&
    event.target.type === 'password'
  ) {
    return;
  }

  const text = event.clipboardData?.getData('text')?.trim();

  if (text === ADMIN_COMMAND) {
    event.preventDefault();
    openAdminLogin();
  }
}, true);

document.addEventListener('input', event => {
  if (
    event.target instanceof HTMLInputElement ||
    event.target instanceof HTMLTextAreaElement
  ) {
    if (
      event.target.type !== 'password' &&
      event.target.value?.trim() === ADMIN_COMMAND
    ) {
      event.target.value = '';
      openAdminLogin();
    }
  }
}, true);

startup();
</script>
