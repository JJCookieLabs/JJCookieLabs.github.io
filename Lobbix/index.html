<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lobbix — JJCookieLabs V0.5</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:light;--bg:#f5f6fa;--panel:#fff;--ink:#1e2430;--muted:#667085;--line:#dce0ea;--accent:#6555d9}
body.dark{color-scheme:dark;--bg:#151722;--panel:#222635;--ink:#f4f5fb;--muted:#b0b6c8;--line:#3c4154;--accent:#9a8dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:var(--accent);color:white}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;padding:11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}label{display:block;margin:13px 0 6px;font-size:14px}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.small{font-size:13px}.app{display:flex;min-height:100dvh}.nav{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:9px}.brand{font-size:23px;font-weight:800;margin-bottom:20px}.main{flex:1;padding:24px;max-width:1100px;margin:auto;width:100%}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.status{padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}.hidden{display:none!important}
.room{position:fixed;inset:0;z-index:10;background:linear-gradient(135deg,#333c66,#1b243f);color:white;display:flex;flex-direction:column}
.room.wall-grid{background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px),linear-gradient(135deg,#333c66,#1b243f);background-size:35px 35px,35px 35px,cover}
.room.wall-waves{background:radial-gradient(ellipse at 15% 10%,#486a91 0%,transparent 60%),radial-gradient(ellipse at 80% 90%,#62528d 0%,transparent 60%),#1c2439}
.room.wall-image{background-size:cover;background-position:center}
.room:before{content:"";position:absolute;inset:0;background:#11182a65;pointer-events:none}
.room>*{position:relative}.roomhead{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0e142d66;backdrop-filter:blur(14px)}
.roomgrid{flex:1;min-height:0;display:grid;grid-template-columns:160px minmax(180px,1fr) minmax(280px,440px);gap:12px;padding:12px}
.glass{border:1px solid #ffffff36;border-radius:16px;background:#121a34a1;backdrop-filter:blur(14px);padding:14px;min-height:0}
.apps{display:flex;flex-direction:column;gap:8px}.apps button{background:#ffffff18;text-align:left;border:1px solid #ffffff20}
.chat{display:flex;flex-direction:column}.messages{overflow:auto;flex:1;min-height:80px;padding:6px 0}.msg{padding:10px;margin:8px 0;background:#ffffff17;border-radius:12px;overflow-wrap:anywhere}.msg small{color:#ccd2eb}.compose{display:flex;gap:7px}.compose input{background:#ffffff1b;color:white;border-color:#ffffff45}.compose input::placeholder{color:#d0d3df}.compose button{white-space:nowrap}
.room button.secondary{color:white;border-color:#ffffff66}.room .muted{color:#c8cce0}.notice{font-size:13px;line-height:1.5}
@media(max-width:850px){.roomgrid{grid-template-columns:1fr;grid-template-rows:auto minmax(100px,1fr) minmax(220px,1.3fr)}.apps{flex-direction:row;overflow:auto}.apps button{white-space:nowrap}.nav{width:76px;padding:10px}.nav button{font-size:0}.nav button span{font-size:20px}.brand{font-size:12px}.main{padding:14px}}
@media(max-width:520px){.app{display:block;padding-bottom:65px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;width:100%;height:60px;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:5px}.nav .brand,.nav .themeBtn{display:none}.nav button{padding:8px}.roomgrid{padding:7px;gap:7px}.roomhead{padding:10px}.glass{padding:10px}}
</style></head><body><div class="app">
<aside class="nav"><div class="brand">🎮 Lobbix</div><button class="secondary" onclick="show('home')"><span>🏠</span> Accueil</button><button class="secondary" onclick="show('explore')"><span>🧭</span> Explorer</button><button class="secondary" onclick="show('profile')"><span>👤</span> Profil</button><button class="secondary themeBtn" onclick="theme()"><span>🌓</span> Thème</button></aside>
<main class="main"><div class="row"><h1 id="title">Lobbix</h1><button class="secondary" onclick="theme()">☀️ / 🌙</button></div><div id="status" class="status">Connexion…</div><div id="content"></div></main></div>
<div id="room" class="room hidden"><header class="roomhead"><div><strong id="roomTitle">Lobby</strong> <span id="roomCount" class="small"></span></div><button class="secondary" onclick="leave()">← Quitter le lobby</button></header>
<div class="roomgrid"><aside class="glass apps"><button onclick="activity('welcome')">🏠 Lobby</button><button onclick="activity('poll')">📊 Sondage</button><button onclick="activity('draw')">🎨 Dessin</button><button onclick="activity('wheel')">🎡 Roue</button><button onclick="activity('games')">🎮 Jeux</button><button onclick="activity('quiz')">❓ Quiz</button></aside>
<section class="glass" id="activity"><h2>Bienvenue !</h2><p class="muted">Choisis une mini-application.</p><label>Fond d'écran personnel</label><select id="wall" onchange="setWall(this.value)"><option value="aurora">Aurore</option><option value="grid">Grille</option><option value="waves">Vagues</option></select><p class="notice muted">Les mini-applications sont encore locales à cet appareil.</p></section>
<section class="glass chat"><h3>💬 Chat en direct</h3><div id="messages" class="messages"></div><div class="compose"><input id="message" maxlength="2000" placeholder="Message (2 000 caractères max)" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Envoyer</button></div></section></div></div>
<script>
window.__lobbixLibError = false;
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="window.__lobbixLibError=true"></script>
<script>
const SUPABASE_URL = 'https://hkwnfxgrnyvyfprzvlyb.supabase.co';
const KEY = 'sb_publishable_hzBek5ZmTxpaNZcQiDPwgA_i4Lhv3o0';
let db=null;
const wait=(promise,ms=12000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Délai dépassé ('+Math.round(ms/1000)+' s). Vérifie la connexion à Supabase et la console F12.')),ms))]);
async function ensureLibrary(){
 if(window.supabase?.createClient)return;
 const script=document.createElement('script');
 script.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';
 await wait(new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error('Impossible de charger Supabase JS (CDN bloqué ou hors ligne).'));document.head.appendChild(script)}),9000);
 if(!window.supabase?.createClient)throw new Error('Bibliothèque Supabase introuvable.');
}
window.addEventListener('error',e=>{console.error('Lobbix:',e.error||e.message);if(document.getElementById('status')?.textContent==='Connexion…')status('🔴 Erreur JavaScript : '+e.message)});
window.addEventListener('unhandledrejection',e=>{console.error('Lobbix Promise:',e.reason);if(document.getElementById('status')?.textContent==='Connexion…')status('🔴 Erreur : '+(e.reason?.message||e.reason))});

let user=null,profile=null,rooms=[],current=null,joinedAt=null,view='home',poller=null,activityName='welcome';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function err(e){alert(e?.message||String(e))}
function status(s){$('status').textContent=s}
function theme(){document.body.classList.toggle('dark');localStorage.setItem('lobbix-theme',document.body.classList.contains('dark')?'dark':'light')}
if(localStorage.getItem('lobbix-theme')==='dark')document.body.classList.add('dark');
async function init(){
 try{
  status('Chargement de Supabase…');
  await ensureLibrary();
  db = window.supabase.createClient(SUPABASE_URL, KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    storageKey: 'lobbix-auth-v05'
   }
  });
  status('Vérification de la session…');
  let {data:{session},error}=await wait(db.auth.getSession());
  if(error)throw error;
  if(!session){
   status('Création de la session anonyme…');
   let r=await wait(db.auth.signInAnonymously(),18000);
   if(r.error)throw r.error;
   session=r.data.session;
  }
  if(!session?.user)throw new Error('Supabase ne renvoie pas de session utilisateur.');
  user=session.user;
  status('Chargement du profil…');
  await wait(loadProfile());
  status('Chargement des lobbies…');
  await wait(refresh());
  status('🟢 Connecté à Supabase · '+(profile?.nickname||'profil à créer'));
 }catch(e){
  console.error('Erreur initialisation Lobbix',e);
  status('🔴 '+(e?.message||String(e)));
  $('content').innerHTML='<div class="card"><h2>Connexion impossible</h2><p>La cause exacte est affichée ci-dessus et dans la console F12.</p><button onclick="location.reload()">Réessayer</button><p class="muted small">Vérifie que le projet Supabase est actif, que les connexions anonymes sont activées et que ton navigateur autorise les requêtes vers supabase.co.</p></div>';
 }
}
async function loadProfile(){const {data,error}=await db.from('lobbix_profiles').select('id,nickname').eq('id',user.id).maybeSingle();if(error)throw error;profile=data}
async function refresh(){if(!profile){$('content').innerHTML=`<div class="card"><h2>Créer mon profil</h2><p class="muted">Pseudonyme unique de 3 à 24 caractères (lettres, chiffres, _).</p><input id="nick" maxlength="24" placeholder="Ton pseudonyme"><p><label><input type="checkbox" id="agree" style="width:auto"> J'accepte les règles de démonstration.</label></p><p class="notice">Ce prototype n'inclut pas encore les documents juridiques définitifs.</p><button onclick="register()">Continuer</button></div>`;return}
const {data,error}=await db.from('lobbix_lobbies').select('id,name,description,is_public,is_random,expires_at,empty_timeout_minutes,created_at').eq('is_public',true).order('created_at',{ascending:true});if(error)throw error;rooms=data||[];render()}
async function register(){const nick=$('nick').value.trim();if(!$('agree').checked)return alert('Accepte les règles de démonstration.');const {error}=await db.rpc('lobbix_set_nickname',{p_nickname:nick});if(error)return err(error);await loadProfile();await refresh();status('🟢 Connecté · '+profile.nickname)}
function show(v){view=v;render()}
function roomCard(r){return `<div class="card"><div class="row"><h3>${r.is_random?'🎲':'🎮'} ${esc(r.name)}</h3><span class="small muted">${r.is_random?'Permanent':'Public'}</span></div><p class="muted">${esc(r.description)}</p><button onclick="join('${r.id}')">Rejoindre</button></div>`}
function render(){if(!profile)return;$('title').textContent=({home:'Accueil',explore:'Explorer',profile:'Profil',create:'Créer un lobby'})[view]||'Lobbix';if(view==='home')$('content').innerHTML=`<div class="row"><h2>Bienvenue, ${esc(profile.nickname)} !</h2><button onclick="show('create')">＋ Créer un lobby</button></div><div class="grid">${rooms.filter(r=>r.is_random).map(roomCard).join('')}</div><p class="muted">Lobbies et messages partagés via Supabase. Version de test non destinée au public.</p><button class="secondary" onclick="show('explore')">Explorer</button>`;
if(view==='explore')$('content').innerHTML=`<div class="row"><h2>Lobbies publics</h2><button onclick="show('create')">＋ Créer</button></div><input id="search" placeholder="Rechercher…" oninput="filterRooms()"><div id="roomResults" class="grid">${rooms.map(roomCard).join('')}</div><p class="muted small">Version de test : les lobbies vides peuvent encore apparaître.</p>`;
if(view==='profile')$('content').innerHTML=`<div class="card"><h2>👤 ${esc(profile.nickname)}</h2><p class="muted">Identité Supabase anonyme : ${esc(user.id)}</p><p>Le code de récupération, les amis et l'administration sécurisée seront ajoutés ensuite.</p><button class="secondary" onclick="theme()">Changer le thème</button></div>`;
if(view==='create')$('content').innerHTML=`<div class="card"><h2>Créer un lobby public</h2><label>Nom</label><input id="lname" maxlength="60"><label>Description</label><textarea id="ldesc" maxlength="150"></textarea><label>Durée</label><select id="duration"><option value="">Permanent</option><option value="1">1 heure</option><option value="6">6 heures</option><option value="24">24 heures</option></select><label>Suppression après inactivité (1–30 min, fonctionnalité à venir)</label><input id="empty" type="number" min="1" max="30" value="30"><p class="notice">Les lobbies privés nécessitant lien + mot de passe ne sont pas encore pris en charge.</p><button onclick="create()">Créer</button> <button class="secondary" onclick="show('home')">Annuler</button></div>`}
function filterRooms(){const q=$('search').value.toLowerCase();$('roomResults').innerHTML=rooms.filter(r=>r.name.toLowerCase().includes(q)).map(roomCard).join('')||'<p>Aucun lobby.</p>'}
async function create(){const name=$('lname').value.trim(),description=$('ldesc').value.trim(),hours=$('duration').value,minutes=Number($('empty').value);const {data,error}=await db.rpc('lobbix_create_lobby',{p_name:name,p_description:description,p_public:true,p_hours:hours?Number(hours):null,p_empty_minutes:minutes});if(error)return err(error);await refresh();await join(data)}
async function join(id){const {error}=await db.rpc('lobbix_join_public',{p_lobby:id});if(error)return err(error);current=rooms.find(r=>r.id===id)||{id,name:'Lobby'};const {data}=await db.from('lobbix_members').select('joined_at').eq('lobby_id',id).eq('user_id',user.id).maybeSingle();joinedAt=data?.joined_at||new Date().toISOString();$('room').classList.remove('hidden');$('roomTitle').textContent=current.name;setWall(localStorage.getItem('lobbix-wall')||'aurora');activity('welcome');await updateChat();clearInterval(poller);poller=setInterval(updateChat,2500)}
async function leave(){clearInterval(poller);poller=null;const {error}=await db.rpc('lobbix_leave');if(error)return err(error);current=null;$('room').classList.add('hidden');await refresh()}
async function updateChat(){if(!current)return;const {data,error}=await db.from('lobbix_messages').select('id,sender_id,body,created_at,deleted_at').eq('lobby_id',current.id).gte('created_at',joinedAt).order('created_at',{ascending:true}).limit(150);if(error){console.warn(error);return}const box=$('messages'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<90;box.innerHTML=(data||[]).map(m=>`<div class="msg"><small>${m.sender_id===user.id?esc(profile.nickname):'Joueur '+esc(m.sender_id.slice(0,8))} · ${new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small><div>${m.deleted_at?'Message supprimé':esc(m.body)}</div></div>`).join('')||'<p class="muted">Aucun message depuis ton arrivée.</p>';if(atBottom)box.scrollTop=box.scrollHeight}
async function send(){if(!current)return;const input=$('message'),body=input.value.trim();if(!body)return;if(body==='/{©JJCookieLabs-Administration}')return alert('Le panneau admin sécurisé sera connecté dans une version suivante.');if(body.length>2000)return alert('Maximum 2 000 caractères.');const {error}=await db.rpc('lobbix_send',{p_lobby:current.id,p_body:body});if(error)return err(error);input.value='';await updateChat()}
function setWall(w){$('room').classList.remove('wall-grid','wall-waves','wall-image');if(w==='grid')$('room').classList.add('wall-grid');if(w==='waves')$('room').classList.add('wall-waves');localStorage.setItem('lobbix-wall',w);if($('wall'))$('wall').value=w}
function activity(type){activityName=type;const el=$('activity');if(type==='welcome'){el.innerHTML=`<h2>Bienvenue dans ${esc(current?.name||'Lobbix')} !</h2><p class="muted">Mini-applications à gauche, chat à droite.</p><label>Fond personnel</label><select id="wall" onchange="setWall(this.value)"><option value="aurora">Aurore</option><option value="grid">Grille</option><option value="waves">Vagues</option></select><p class="notice muted">Les mini-apps ne sont pas encore synchronisées.</p>`;setWall(localStorage.getItem('lobbix-wall')||'aurora')}
else if(type==='wheel')el.innerHTML='<h2>🎡 Roue aléatoire</h2><input id="choices" placeholder="Pizza, Sushi, Burger"><p><button onclick="spin()">Tirer au sort</button></p><h3 id="result"></h3>';
else if(type==='draw'){el.innerHTML='<h2>🎨 Dessin local</h2><canvas id="canvas" width="560" height="320" style="width:100%;background:white;border-radius:10px;touch-action:none"></canvas><button onclick="activity(\'draw\')">Effacer</button>';draw()}
else el.innerHTML=`<h2>${{poll:'📊 Sondages',games:'🎮 Jeux',quiz:'❓ Quiz'}[type]}</h2><p class="muted">Disponible dans une prochaine version.</p>`}
function spin(){const a=$('choices').value.split(',').map(x=>x.trim()).filter(Boolean);if(a.length<2)return alert('Ajoute au moins 2 choix.');const b=new Uint32Array(1);crypto.getRandomValues(b);$('result').textContent='🎉 '+a[b[0]%a.length]}
function draw(){const c=$('canvas'),ctx=c.getContext('2d');ctx.strokeStyle='#6555d9';ctx.lineWidth=3;ctx.lineCap='round';let down=false;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false}
init();
</script></body></html>
