<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — JJCookieLabs</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #141826;
      color: #f3f3ff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main { padding: 24px; }
    h1 { margin: 0; font-size: clamp(80px, 20vw, 150px); }
    p { color: #c0c7de; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #6554d9;
      color: white;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    a:hover {
      background: #7968ed;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <h1>404 🍪</h1>
    <h2>Cette page s’est fait manger !</h2>
    <p>L’adresse est incorrecte ou la page a été déplacée.</p>
    <a href="/">Retour à l’accueil</a>
  </main>
</body>
</html>
