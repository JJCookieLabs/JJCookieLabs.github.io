<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JJCookieLabs - Portail principal et hub de projets.">
    <title>JJCookieLabs | Accueil</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #2a2f3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-color);
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 3.5rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            text-align: left;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.8rem;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 0.6rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            text-align: center;
            background-color: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">JJCookieLabs</div>
        <nav>
            <a href="./index.html">Accueil</a>
            <a href="./CRSHStudio/index.html">CRSHStudio</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to JJCookieLabs</h1>
        <p class="subtitle">Espace central et laboratoire de projets numériques.</p>

        <div class="projects-grid">
            <article class="card">
                <div>
                    <h2>CRSHStudio</h2>
                    <p>Accédez à l'espace dédié au projet CRSHStudio, nos créations et outils.</p>
                </div>
                <a href="./CRSHStudio/index.html" class="btn">Ouvrir CRSHStudio &rarr;</a>
            </article>
        </div>
    </main>

    <footer>
        &copy; 2026 JJCookieLabs. Tous droits réservés.
    </footer>

</body>
</html>
